name: Develop
on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Create Github tag/release and export short SHA of current HEAD
  prepareRelease:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.url }}
      github_sha_short: ${{ steps.slug.outputs.sha8 }}
      alias_release: ${{ steps.determine_release.outputs.alias_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
      - name: Set Alias release/tag name
        id: determine_release
        run: |
          echo "alias_release=Build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # First create the plain release, so the upload URL could be exported
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine_release.outputs.alias_release }}
          draft: false
          prerelease: false
          target_commitish: "develop"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Releasenotes from Develop
        id: create_release_develop
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.determine_release.outputs.alias_release }}
          name: "Continuous build #${{ github.run_number }}"
          body: |
            Build #${{ github.run_number }} from ${{ steps.date.outputs.date }}
            - To verify checksums see dedicated checksum files for each download
          draft: false
          prerelease: true
          target_commitish: "develop"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build all x86 Linux flavours except Ubuntu 20.04. See next step.
  buildLinux:
    runs-on: ubuntu-latest
    needs: prepareRelease
    outputs:
      github_sha_short: ${{ needs.prepareRelease.outputs.github_sha_short }}
      alias_release: ${{ needs.prepareRelease.outputs.alias_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build binaries
        run: >
          docker build
          -t local
          -f Docker/Ubuntu/Dockerfile_20_04_noUpload
          --build-arg BUILD_THREADS=2
          --build-arg GITHUB_CI_TOKEN=${{ secrets.GITHUB_TOKEN }}
          --build-arg GIT_COMMIT=${{ needs.prepareRelease.outputs.github_sha_short }}
          --build-arg ALIAS_RELEASE=${{ needs.prepareRelease.outputs.alias_release }}
          --build-arg REPLACE_EXISTING_ARCHIVE=--replace
          --build-arg ALIAS_USER=${{ github.repository_owner }}
          --build-arg ALIAS_REPOSITORY=${{ github.event.repository.name }}
          .
        env:
          GITHUB_CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stage aliaswalletd from the built image. Dockerfile_20_04_noUpload is a
      # single-stage build, so the binary sits where the build script put it.
      # (/filesToUpload only exists in the upload variant, which we do not use
      # because it publishes its own Ubuntu-20-04.tgz asset.) Tor is not bundled
      # separately on Linux (the daemon loads system Tor); only the daemon binary
      # is needed by the desktop app.
      - name: Stage Linux raw binary archive
        run: |
          mkdir -p /tmp/linux-raw/aliaswalletd-linux
          docker create --name alias-extract local
          trap 'docker rm -f alias-extract >/dev/null 2>&1 || true' EXIT
          if ! docker cp alias-extract:/alias-wallet/cmake-build-cmdline/aliaswallet/src/aliaswalletd \
                         /tmp/linux-raw/aliaswalletd-linux/aliaswalletd; then
            echo "ERROR: aliaswalletd not at the expected path in the image."
            docker run --rm --entrypoint sh local -c 'find / -name aliaswalletd -type f 2>/dev/null | head -20'
            exit 1
          fi
          cd /tmp/linux-raw
          zip -r ALIAS.zip aliaswalletd-linux/
          test -f ALIAS.zip || { echo "ERROR: ALIAS.zip was not created."; exit 1; }

      - name: Upload Linux raw binary archive
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /tmp/linux-raw/ALIAS.zip
          asset_name: ALIAS-${{ needs.prepareRelease.outputs.alias_release }}-${{ needs.prepareRelease.outputs.github_sha_short }}-Linux.zip
          tag: ${{ needs.prepareRelease.outputs.alias_release }}
          overwrite: true

  # ==========================================================================
  # Build aarch64 version (Raspberry PI ARMv8)
  buildMacOS:
    runs-on: ${{ matrix.runner }}
    needs: prepareRelease
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt is gone from this branch, so the daemon can be built natively on
          # Apple Silicon as well as Intel.
          - runner: macos-15-intel
            arch: x86_64
            asset_suffix: Mac
          - runner: macos-15
            arch: arm64
            asset_suffix: Mac-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew uninstall --ignore-dependencies berkeley-db || true
          brew install boost openssl
          # Berkeley DB 4.8 is required for wallet.dat compatibility, but Homebrew
          # disabled the berkeley-db@4 formula. Reproduce Homebrew's proven build:
          # its clang + Big Sur patches, plus -Wno-implicit-function-declaration so
          # configure's pthread mutex probe passes under modern clang (otherwise it
          # falls back to fcntl and errors on the shared latch). Single-threaded
          # build into the /usr/local/opt/berkeley-db@4 path the build expects.
          curl -fsSL -o /tmp/db.tar.gz https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  /tmp/db.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/db.tar.gz -C /tmp
          curl -fsSL -o /tmp/db-clang.diff "https://raw.githubusercontent.com/Homebrew/formula-patches/4c55b1/berkeley-db%404/clang.diff"
          curl -fsSL -o /tmp/db-bigsur.diff "https://raw.githubusercontent.com/Homebrew/formula-patches/03cf8088210822aa2c1ab544ed58ea04c897d9c4/libtool/configure-pre-0.4.2.418-big_sur.diff"
          cd /tmp/db-4.8.30.NC
          patch -p1 < /tmp/db-clang.diff
          ( cd dist && patch -p1 < /tmp/db-bigsur.diff )
          export CFLAGS="-Wno-implicit-function-declaration"
          cd build_unix
          ../dist/configure --enable-cxx --prefix="$(brew --prefix)/opt/berkeley-db@4"
          make
          make install

      - name: Cache build dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-build-dependencies-mac-${{ matrix.arch }}-v4
        with:
          path: |
            ${{ github.workspace }}/cmake-build-cmdline-mac/*
            !${{ github.workspace }}/cmake-build-cmdline-mac/aliaswallet
          key: ${{ runner.os }}-${{ env.cache-name }}

      - name: Build MacOS binaries
        run: ./scripts/cmake-build-mac.sh

      - name: Stage MacOS daemon archive
        run: |
          build_dir=${{ github.workspace }}/cmake-build-cmdline-mac/aliaswallet
          daemon=$(find "$build_dir" -type f -name aliaswalletd -perm -u+x | head -1)
          if [ -z "$daemon" ]; then
            echo "ERROR: aliaswalletd was not produced by the build."
            find "$build_dir" -type f -perm -u+x -not -path '*/CMakeFiles/*' | head -40
            exit 1
          fi
          tor_dir=$(dirname "$daemon")/Tor
          if [ ! -d "$tor_dir" ]; then
            echo "ERROR: Tor was not staged next to the daemon: $tor_dir"
            ls -la "$(dirname "$daemon")"
            exit 1
          fi
          echo "daemon: $daemon"
          otool -L "$daemon" || true
          mkdir -p /tmp/mac-raw/ALIAS
          cp "$daemon" /tmp/mac-raw/ALIAS/aliaswalletd
          cp -R "$tor_dir" /tmp/mac-raw/ALIAS/Tor
          cd /tmp/mac-raw
          zip -r ALIAS.zip ALIAS/

      - name: Upload MacOS raw binary archive
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /tmp/mac-raw/ALIAS.zip
          asset_name: ALIAS-${{ needs.prepareRelease.outputs.alias_release }}-${{ needs.prepareRelease.outputs.github_sha_short }}-${{ matrix.asset_suffix }}.zip
          tag: ${{ needs.prepareRelease.outputs.alias_release }}
          overwrite: true

  # ==========================================================================
  # Build Windows x64 version

  buildWindows:
    runs-on: windows-latest
    needs: prepareRelease
    outputs:
      upload_url: ${{ needs.prepareRelease.outputs.upload_url }}
      github_sha_short: ${{ needs.prepareRelease.outputs.github_sha_short }}
      alias_release: ${{ needs.prepareRelease.outputs.alias_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install vcpkg and packages with cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: e8709ee8703328fe121eab33cda73a406a7626b7

      - name: Build Windows binaries
        run: ./scripts/cmake-build-win.bat daemon
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VSDIR: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise'
          CMAKEDIR: 'C:\Program Files\CMake\bin'
          VCPKGDIR: ${{ github.workspace }}/vcpkg

      - name: Stage Windows daemon archive
        shell: bash
        run: |
          daemon=$(find build -type f -name aliaswalletd.exe | head -1)
          if [ -z "$daemon" ]; then
            echo "ERROR: aliaswalletd.exe was not produced by the build."
            find build -type f -name '*.exe' | head -40
            exit 1
          fi
          dir=$(dirname "$daemon")
          if [ ! -d "$dir/Tor" ]; then
            echo "ERROR: Tor was not staged next to the daemon: $dir/Tor"
            ls -la "$dir"
            exit 1
          fi
          echo "daemon: $daemon"
          mkdir -p win-raw/ALIAS
          cp "$dir"/*.dll win-raw/ALIAS/ 2>/dev/null || true
          cp "$daemon" win-raw/ALIAS/aliaswalletd.exe
          cp -R "$dir/Tor" win-raw/ALIAS/Tor
          ls -la win-raw/ALIAS
          ( cd win-raw && 7z a -tzip ALIAS.zip ALIAS/ )
          test -f win-raw/ALIAS.zip || { echo "ERROR: win-raw/ALIAS.zip was not created."; exit 1; }
      - name: Upload Windows Build
        id: upload-release-asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: win-raw/ALIAS.zip
          asset_name: ALIAS-${{ needs.prepareRelease.outputs.alias_release }}-${{ needs.prepareRelease.outputs.github_sha_short }}-Win64.zip
          tag: ${{ needs.prepareRelease.outputs.alias_release }}
          overwrite: true


  # ==========================================================================
  # Build Windows x86 version
  buildWindowsX86:
    runs-on: windows-latest
    needs: prepareRelease
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install vcpkg and packages with cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: e8709ee8703328fe121eab33cda73a406a7626b7

      - name: Build Windows binaries
        run: ./scripts/cmake-build-win-x86.bat daemon
        env:
          VCPKG_DEFAULT_TRIPLET: x86-windows
          VSDIR: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise'
          CMAKEDIR_x86: 'C:\Program Files\CMake\bin'
          VCPKGDIR: ${{ github.workspace }}/vcpkg

      - name: Stage Windows daemon archive
        shell: bash
        run: |
          daemon=$(find build-x86 -type f -name aliaswalletd.exe | head -1)
          if [ -z "$daemon" ]; then
            echo "ERROR: aliaswalletd.exe was not produced by the build."
            find build-x86 -type f -name '*.exe' | head -40
            exit 1
          fi
          dir=$(dirname "$daemon")
          if [ ! -d "$dir/Tor" ]; then
            echo "ERROR: Tor was not staged next to the daemon: $dir/Tor"
            ls -la "$dir"
            exit 1
          fi
          echo "daemon: $daemon"
          mkdir -p win32-raw/ALIAS
          cp "$dir"/*.dll win32-raw/ALIAS/ 2>/dev/null || true
          cp "$daemon" win32-raw/ALIAS/aliaswalletd.exe
          cp -R "$dir/Tor" win32-raw/ALIAS/Tor
          ls -la win32-raw/ALIAS
          ( cd win32-raw && 7z a -tzip ALIAS.zip ALIAS/ )
          test -f win32-raw/ALIAS.zip || { echo "ERROR: win32-raw/ALIAS.zip was not created."; exit 1; }

      - name: Upload Windows Build
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: win32-raw/ALIAS.zip
          asset_name: ALIAS-${{ needs.prepareRelease.outputs.alias_release }}-${{ needs.prepareRelease.outputs.github_sha_short }}-Win32.zip
          tag: ${{ needs.prepareRelease.outputs.alias_release }}
          overwrite: true
