name: Featurebranch
on:
  push:
    branches-ignore:
      - 'master'
      - 'develop'
      - '*android*'

jobs:
  # ==========================================================================
  # Build all x86 Linux flavours
  buildLinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ CentOS/Dockerfile, Debian/Dockerfile_Buster, Debian/Dockerfile_Stretch, Fedora/Dockerfile, OpenSUSE/Dockerfile, Ubuntu/Dockerfile_18_04, Ubuntu/Dockerfile_20_04 ]
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Build binaries
        run: docker build -t local -f Docker/${{ matrix.distro }}_noUpload --build-arg BUILD_THREADS=2 .
        env:
          GITHUB_CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build aarch64 version (Raspberry PI ARMv8)
  buildARM:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm64
      - name: Build binaries
        run: docker build -t local -f Docker/RaspberryPi/Dockerfile_Buster_noUpload --build-arg BUILD_THREADS=2 .
        env:
          GITHUB_CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Build MacOS version
  buildMacOS:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.10'
          modules: 'qtwebengine'

      - name: Install dependencies
        run: |
          brew uninstall --ignore-dependencies berkeley-db || true
          brew install boost openssl
          # Berkeley DB 4.8 is required for wallet.dat compatibility, but Homebrew
          # disabled the berkeley-db@4 formula. Reproduce Homebrew's proven build:
          # its clang + Big Sur patches, plus -Wno-implicit-function-declaration so
          # configure's pthread mutex probe passes under modern clang (otherwise it
          # falls back to fcntl and errors on the shared latch). Single-threaded
          # build into the /usr/local/opt/berkeley-db@4 path the build expects.
          curl -fsSL -o /tmp/db.tar.gz https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  /tmp/db.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/db.tar.gz -C /tmp
          curl -fsSL -o /tmp/db-clang.diff "https://raw.githubusercontent.com/Homebrew/formula-patches/4c55b1/berkeley-db%404/clang.diff"
          curl -fsSL -o /tmp/db-bigsur.diff "https://raw.githubusercontent.com/Homebrew/formula-patches/03cf8088210822aa2c1ab544ed58ea04c897d9c4/libtool/configure-pre-0.4.2.418-big_sur.diff"
          cd /tmp/db-4.8.30.NC
          patch -p1 < /tmp/db-clang.diff
          ( cd dist && patch -p1 < /tmp/db-bigsur.diff )
          export CFLAGS="-Wno-implicit-function-declaration"
          cd build_unix
          ../dist/configure --enable-cxx --prefix=/usr/local/opt/berkeley-db@4
          make
          make install

      - name: Cache build dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-build-dependencies-mac-v3
        with:
          path: |
            ${{ github.workspace }}/cmake-build-cmdline-mac/*
            !${{ github.workspace }}/cmake-build-cmdline-mac/aliaswallet
            ~/Archives/Tor/Tor.libraries.MacOS.zip
          key: ${{ runner.os }}-${{ env.cache-name }}

      - name: Build MacOS binaries
        run: ./scripts/cmake-build-mac.sh -g
        env:
          MAC_QT_DIR: ${{ env.QT_ROOT_DIR }}

  # ==========================================================================
  # Build Windows x64 version
  buildWindows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v2
        with:
          version: '5.12.9'
          setup-python: 'false'
          modules: 'qtwebengine'
      - name: Install pkg-config (pinned vcpkg's msys2 pkg-config mirror is dead)
        run: choco install pkgconfiglite -y --no-progress
      - name: Install vcpkg and packages with cache
        uses: lukka/run-vcpkg@v6
        with:
          vcpkgArguments: 'berkeleydb boost leveldb openssl'
          vcpkgGitCommitId: a037d826492039db9d58af47a1e1248037d15f40
          vcpkgTriplet: x64-windows
        env:
          # Old vcpkg ports (e.g. bzip2) declare cmake_minimum_required < 3.5,
          # which CMake 4.x rejects as a fatal error. Restore the old floor.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # Use overlay triplets that hand vcpkg a local pkg-config, so bzip2's
          # vcpkg_fixup_pkgconfig does not fetch the removed msys2 package.
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/vcpkg-overlay-triplets
      - name: Build Windows binaries
        run: ./scripts/cmake-build-win.bat
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          QTDIR: ${{ env.Qt5_Dir }}
          VSDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          CMAKEDIR: 'C:\Program Files\CMake\bin'
          VCPKGDIR: ${{ github.workspace }}/vcpkg

  # ==========================================================================
  # Build Windows x86 version
  buildWindowsX86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v2
        with:
          version: '5.12.9'
          setup-python: 'false'
          modules: 'qtwebengine'
          arch: 'win32_msvc2017'
      - name: Install pkg-config (pinned vcpkg's msys2 pkg-config mirror is dead)
        run: choco install pkgconfiglite -y --no-progress
      - name: Install vcpkg and packages with cache
        uses: lukka/run-vcpkg@v6
        with:
          vcpkgArguments: 'berkeleydb boost leveldb openssl'
          vcpkgGitCommitId: a037d826492039db9d58af47a1e1248037d15f40
          vcpkgTriplet: x86-windows
        env:
          # Old vcpkg ports (e.g. bzip2) declare cmake_minimum_required < 3.5,
          # which CMake 4.x rejects as a fatal error. Restore the old floor.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # Use overlay triplets that hand vcpkg a local pkg-config, so bzip2's
          # vcpkg_fixup_pkgconfig does not fetch the removed msys2 package.
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/vcpkg-overlay-triplets
      - name: Build Windows binaries
        run: ./scripts/cmake-build-win-x86.bat
        env:
          VCPKG_DEFAULT_TRIPLET: x86-windows
          QTDIR_x86: ${{ env.Qt5_Dir }}
          VSDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          CMAKEDIR_x86: 'C:\Program Files\CMake\bin'
          VCPKGDIR: ${{ github.workspace }}/vcpkg
